<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141612">
  <meta name="description" content="在曾湘海的电商视觉展厅里自由选路，查看 24 件概念作品和三组商品图前后对比。">
  <meta property="og:title" content="曾湘海的作品集 · 折线展厅">
  <meta property="og:image" content="https://zengxianghai911-gif.github.io/zengxianghai-portfolio/assets/21-thumb.jpg">
  <title>曾湘海的作品集 · 折线展厅</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="shell-v5.css">
  <link rel="stylesheet" href="junction-v5.css">
  <link rel="stylesheet" href="collection-v5.css">
  <script src="works-v3.js" defer></script>
  <script src="collection-v5.js" defer></script>
  <script src="viewer-v5.js" defer></script>
  <script src="junction-v5.js" defer></script>
  <script src="compare-v5.js" defer></script>
</head>
<body>
  <div class="depth-app junction" id="junction" data-room="atrium">
    <header class="depth-header">
      <button type="button" id="show-entry" class="depth-brand" aria-label="曾湘海的作品集，返回中庭">
        <span class="depth-brand-icon" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>曾湘海<span class="depth-brand-divider"></span>作品集</span>
      </button>
      <div class="depth-header-actions">
        <button type="button" id="show-route" aria-haspopup="dialog">展厅地图 <span aria-hidden="true">⊞</span></button>
        <button type="button" id="show-collection">全部作品 <span class="depth-header-count">24</span></button>
      </div>
    </header>
    <main class="depth-stage" id="scene-stage">
      <section class="junction-hall" id="hall" aria-labelledby="hall-title">
        <div class="hall-light" aria-hidden="true"></div>
        <div class="hall-grid" aria-hidden="true"></div>
        <div class="hall-scene" id="hall-scene">
          <div class="hall-info">
            <p class="hall-coordinate" id="hall-coordinate"></p>
            <h1 id="hall-title" tabindex="-1">折线展厅</h1>
            <p class="hall-caption" id="hall-caption"></p>
            <div class="hall-actions" id="hall-actions"></div>
          </div>
          <div class="hall-set" id="hall-set"></div>
        </div>
        <p class="hall-keyboard">← → 转向 <span aria-hidden="true">·</span> ↑ ↓ 进退</p>
        <button type="button" class="mini-map" id="mini-map" aria-haspopup="dialog" aria-label="打开展厅地图">
          <span></span><canvas aria-hidden="true"></canvas>
        </button>
      </section>
      <section class="depth-scene comparison" id="comparison" aria-labelledby="comparison-title" hidden>
        <header class="comparison-head">
          <div><p class="hall-coordinate">D–03 / RETOUCH</p><h1 id="comparison-title" tabindex="-1">原片与成片</h1></div>
          <div class="comparison-cases" id="comparison-cases" role="group" aria-label="选择商品案例"></div>
        </header>
        <div class="comparison-body">
          <div class="compare-square" id="compare-square">
            <img id="compare-after" alt="" width="800" height="800" draggable="false">
            <img id="compare-before" alt="" width="800" height="800" draggable="false">
            <span class="compare-tag compare-tag-before">模拟原片</span>
            <span class="compare-tag compare-tag-after">处理效果</span>
            <div class="compare-handle" aria-hidden="true"><span>‹ ›</span></div>
            <input id="compare-range" type="range" min="0" max="100" value="50" aria-label="调整原片与处理效果的分界线" aria-describedby="compare-help">
          </div>
          <aside class="compare-notes">
            <h2 id="compare-name" aria-live="polite"></h2>
            <dl>
              <dt>原片问题</dt><dd id="compare-problem"></dd>
              <dt>处理思路</dt><dd id="compare-fix"></dd>
            </dl>
            <p id="compare-help">左右拖动看差别，也可用方向键调整。</p>
            <p class="compare-credit">AI 辅助模拟素材 · 概念案例</p>
          </aside>
        </div>
      </section>
      <section class="depth-scene collection-scene" id="collection" aria-labelledby="collection-title" hidden><div id="collection-content"></div></section>
      <div class="junction-veil" id="junction-veil" aria-hidden="true"></div>
      <noscript><div class="depth-noscript"><p>开启 JavaScript 即可进入展厅。</p><a href="https://github.com/zengxianghai911-gif/zengxianghai-portfolio/releases/download/v2.0.0/portfolio-24.zip" download>下载全部 24 件作品</a></div></noscript>
    </main>
    <footer class="junction-console" id="junction-console" aria-label="在展厅移动">
      <div class="junction-location"><span id="location-code">A–00</span><strong id="location-title" aria-live="polite">中庭</strong></div>
      <div class="junction-directions" id="junction-directions">
        <button type="button" data-direction="left"><span aria-hidden="true">←</span><span>左转</span></button>
        <button type="button" data-direction="back"><span aria-hidden="true">↓</span><span>后退</span></button>
        <button type="button" data-direction="forward"><span aria-hidden="true">↑</span><span>向前</span></button>
        <button type="button" data-direction="right"><span aria-hidden="true">→</span><span>右转</span></button>
      </div>
      <span class="junction-employment">电商视觉 · 远程居家兼职</span>
    </footer>
  </div>
  <dialog class="route-dialog junction-route" id="route-dialog" aria-labelledby="route-title">
    <header class="route-heading"><div><p>折线展厅</p><h2 id="route-title">展厅地图</h2></div><button type="button" id="route-close" aria-label="关闭展厅地图">×</button></header>
    <div class="plan" id="plan"><canvas aria-hidden="true"></canvas></div>
    <div class="route-foot"><span>点选展区直接到达</span><button type="button" id="toggle-motion" aria-pressed="false">减少动效</button></div>
  </dialog>
  <dialog class="depth-viewer" id="depth-viewer" aria-labelledby="art-title">
    <header class="viewer-head">
      <div><p id="art-kind"></p><h2 id="art-title"></h2></div>
      <button type="button" id="art-close" aria-label="退出作品查看">返回 <span aria-hidden="true">×</span></button>
    </header>
    <div class="viewer-main">
      <div class="viewer-frame" id="art-frame">
        <img id="art-image" alt="" draggable="false">
        <p id="art-image-state" role="status"></p>
        <div class="viewer-slices" id="viewer-slices" hidden>
          <button type="button" id="slice-back" aria-label="上一段长图">‹</button>
          <span id="slice-index" aria-live="polite"></span>
          <button type="button" id="slice-next" aria-label="下一段长图">›</button>
        </div>
      </div>
      <aside class="viewer-aside">
        <h3>画面解读</h3>
        <p id="art-note"></p>
        <p id="art-focus" class="viewer-focus"></p>
        <div class="viewer-links"><a id="art-original" target="_blank" rel="noopener">打开完整原图 ↗</a><button type="button" id="slice-toggle" hidden>分段查看</button></div>
      </aside>
    </div>
    <footer class="viewer-controls">
      <button type="button" id="art-prev">← 上一件</button><span id="art-index" aria-live="polite"></span><button type="button" id="art-next">下一件 →</button>
    </footer>
  </dialog>
</body>
</html>
